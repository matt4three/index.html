<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hannah 💗</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff0f5,#ffd8e5);
}
.card{
  width:min(90%,430px); padding:42px 26px; text-align:center;
  background:rgba(255,255,255,.94); border-radius:30px;
  box-shadow:0 20px 60px rgba(170,70,100,.2);
  position:relative; z-index:2;
}
.emoji{font-size:60px;margin-bottom:8px}
h1{margin:0 0 12px;font-size:31px;color:#3b2029;line-height:1.2}
p{color:#76515d;font-size:17px;margin:0 0 28px}
.buttons{display:flex;gap:12px;justify-content:center}
button{
  border:0;border-radius:999px;padding:16px 30px;font-size:17px;
  font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.yes{background:#ff5d86;color:#fff;box-shadow:0 8px 20px rgba(255,93,134,.3)}
.no{background:#ffd6e1;color:#8a3d54}
button:active{transform:scale(.94)}
.pop{animation:pop .55s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.heart{
  position:fixed;bottom:-50px;z-index:5;pointer-events:none;
  animation:heartUp 3s ease-out forwards;
}
@keyframes heartUp{
  0%{transform:translateY(0) scale(.5) rotate(0);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-115vh) scale(1.4) rotate(360deg);opacity:0}
}
.confetti{
  position:fixed;top:-20px;z-index:4;pointer-events:none;
  width:9px;height:16px;animation:fall 2.8s ease-out forwards;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}
.shake{animation:shake .45s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="emoji">🎬🍿</div>
  <h1>Hannah, wanna watch a movie with me?</h1>
  <p>I'm asking properly this time 😭</p>
  <div class="buttons">
    <button class="yes" onclick="yesClicked()">YES 💗</button>
    <button class="no" onclick="yesClicked()">YES 😌</button>
  </div>
</div>

<script>
function yesClicked(){
  const card=document.getElementById("card");
  card.classList.remove("shake");
  void card.offsetWidth;
  card.classList.add("pop");

  card.innerHTML=`
    <div class="emoji pop">🥹💗</div>
    <h1 class="pop">I KNEW YOU'D SAY YES 😭</h1>
    <p class="pop">Okay, movie date it is 🎬🍿<br><br>Now you can't take it back HAHAHA</p>
  `;

  // Hearts
  for(let i=0;i<45;i++){
    setTimeout(()=>{
      const h=document.createElement("div");
      h.className="heart";
      h.textContent=["💗","💕","❤️","💖","✨"][Math.floor(Math.random()*5)];
      h.style.left=Math.random()*100+"vw";
      h.style.fontSize=(20+Math.random()*25)+"px";
      h.style.animationDuration=(2.2+Math.random()*1.8)+"s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),4500);
    },i*35);
  }

  // Confetti
  for(let i=0;i<70;i++){
    setTimeout(()=>{
      const c=document.createElement("div");
      c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=["#ff5d86","#ffd166","#ff9fbd","#cdb4db","#8ecae6"][Math.floor(Math.random()*5)];
      c.style.transform="rotate("+Math.random()*360+"deg)";
      c.style.animationDelay=(Math.random()*.4)+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3500);
    },i*18);
  }
}
</script>
</body>
</html>
